<!-- Interactive Light Micro-script -->
<script>
    // Live Tabular Clock Handler
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      });
      const dateStr = now.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'short',
        day: 'numeric'
      });
      
      const clockEl = document.getElementById('live-clock');
      const dateEl = document.getElementById('live-date');
      if (clockEl) clockEl.textContent = timeStr;
      if (dateEl) dateEl.textContent = dateStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Pomodoro Interactive Counter Engine
    let isRunning = false;
    let totalSeconds = 25 * 60;
    let currentSeconds = 25 * 60;
    let timerInterval = null;

    const digitsEl = document.getElementById('timer-digits');
    const toggleBtn = document.getElementById('toggle-timer-btn');
    const resetBtn = document.getElementById('reset-timer-btn');
    const progressRing = document.getElementById('timer-progress-ring');
    const circumference = 2 * Math.PI * 140; // ~879.64

    function renderTimerDisplay() {
      const mins = Math.floor(currentSeconds / 60).toString().padStart(2, '0');
      const secs = (currentSeconds % 60).toString().padStart(2, '0');
      digitsEl.textContent = `${mins}:${secs}`;

      // Progress offset
      const progressRatio = currentSeconds / totalSeconds;
      const offset = circumference * (1 - progressRatio);
      progressRing.style.strokeDashoffset = offset;
    }

    toggleBtn.addEventListener('click', () => {
      isRunning = !isRunning;
      if (isRunning) {
        toggleBtn.innerHTML = `
          <span class="material-symbols-outlined text-[22px] font-bold" data-icon="pause">pause</span>
          <span>Pause</span>
        `;
        timerInterval = setInterval(() => {
          if (currentSeconds > 0) {
            currentSeconds--;
            renderTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            toggleBtn.innerHTML = `
              <span class="material-symbols-outlined text-[22px] font-bold" data-icon="play_arrow">play_arrow</span>
              <span>Start Focus</span>
            `;
          }
        }, 1000);
      } else {
        clearInterval(timerInterval);
        toggleBtn.innerHTML = `
          <span class="material-symbols-outlined text-[22px] font-bold" data-icon="play_arrow">play_arrow</span>
          <span>Start Focus</span>
        `;
      }
    });

    resetBtn.addEventListener('click', () => {
      clearInterval(timerInterval);
      isRunning = false;
      currentSeconds = 25 * 60;
      renderTimerDisplay();
      toggleBtn.innerHTML = `
        <span class="material-symbols-outlined text-[22px] font-bold" data-icon="play_arrow">play_arrow</span>
        <span>Start Focus</span>
      `;
    });

    // Fullscreen toggler
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });
  </script>
