<style>

      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      font-family: 'Material Symbols Outlined';
      font-display: block;

      0%, 100% {
        transform: scale(1);
        opacity: 0.35;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.65;
      }
    }

    .ambient-glow {
      animation: subtle-breath 9s ease-in-out infinite;
    }

    .zen-clock-digits {
      font-feature-settings: "tnum" 1;
      letter-spacing: -0.04em;
    }
  </style>

<body class="bg-surface text-on-surface select-none overflow-hidden h-screen w-screen flex flex-col justify-between relative font-body-md text-body-md">
<!-- Fullscreen Atmospheric Background Image -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<img alt="Atmospheric misty dark pine forest" class="w-full h-full object-cover object-center filter brightness-[0.70] contrast-[1.05] scale-[1.02]" src="https://lh3.googleusercontent.com/aida/ALJJyrBn6mNrHG2c-FjV39G8Y0ibGyDBkAP26a6OjhAc_LBEJDTQ6Wwm664VcaYzle6yEGlwFfjJ5sKWIla1amr5jdAG3J70fblx8SOyfjTruBjqxP1SKnib5DeGa7nQBN8l9JsLdAWPjl8fWoyKo78EjttvJ0Efrm36M3IFSTUYa7edAejI0ZHBMEJ5NC9-QJiZZ194oeyqyaHeJSdtZeeiNfNbxZhvk-fhSLhEBuRsdjg5PB_S64Rj3zlR2S0"/>
<!-- Deep Botanical Vignette Overlays -->
<div class="absolute inset-0 bg-radial from-transparent via-[#09120F]/55 to-[#041510]/95 mix-blend-multiply"></div>
<div class="absolute inset-0 bg-gradient-to-t from-[#07100d] via-transparent to-[#07100d]/70"></div>
<div class="absolute inset-0 bg-surface-dim/35 backdrop-blur-[2px]"></div>
</div>
<!-- Subtle Micro-Header with Minimal Hover Exit -->
<header class="relative z-30 w-full px-8 py-6 flex justify-between items-center">
<!-- Faint Brand Watermark -->
<div class="flex items-center gap-2 text-on-surface-variant/30 text-label-sm font-label-sm tracking-widest uppercase transition-opacity duration-300 hover:text-on-surface-variant/70">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container/40"></span>
<span>VibeSpace</span>
<span class="text-on-surface-variant/20 mx-1">/</span>
<span>Zen Mode</span>
</div>
<!-- Top Right Exit Trigger (Discrete & Lightweight) -->
<button aria-label="Exit Zen Mode" class="opacity-25 hover:opacity-100 transition-all duration-300 group flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container/30 hover:bg-surface-container-high/60 backdrop-blur-md border border-outline-variant/15 text-on-surface-variant hover:text-on-surface cursor-pointer" id="exitZenBtn">
<span class="text-label-sm font-label-sm tracking-wider hidden sm:inline-block">Exit</span>
<span class="material-symbols-outlined text-[18px] group-hover:rotate-90 transition-transform duration-300" data-icon="close">close</span>
</button>
</header>
<!-- Central Sanctuary: Solitary Focus Stage -->
<main class="relative z-20 flex-1 flex flex-col items-center justify-center -translate-y-3 px-4">
<!-- Ambient Breathing Halo Behind Digits -->
<div class="absolute w-[450px] sm:w-[580px] h-[320px] rounded-full bg-gradient-to-r from-primary-container/15 via-tertiary-container/10 to-secondary-container/15 blur-[90px] ambient-glow pointer-events-none -z-10"></div>
<!-- Hero Countdown Timer Readout -->
<div class="flex flex-col items-center select-none text-center">
<h1 class="zen-clock-digits font-display-timer font-extralight text-[92px] sm:text-[140px] md:text-[170px] lg:text-[190px] leading-none text-on-surface/90 drop-shadow-[0_10px_35px_rgba(0,0,0,0.6)] tracking-tight cursor-default" id="timerReadout">
        24:38
      </h1>
<!-- Minimal Session Meta & Pomodoro Tracking Beads -->
<div class="mt-4 sm:mt-6 flex flex-col items-center gap-3.5">
<div class="flex items-center gap-3">
<span class="w-4 h-[1px] bg-outline-variant/30"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant/65 tracking-[0.35em] font-medium uppercase">
            Deep Focus
          </span>
<span class="w-4 h-[1px] bg-outline-variant/30"></span>
</div>
<!-- 4 Minimalist Cycle Indicators -->
<div class="flex items-center gap-2.5 pt-1" title="Pomodoro Cycle: 1 of 4 completed">
<!-- Active Dot with Amber Radiance -->
<div class="relative flex items-center justify-center">
<span class="w-2.5 h-2.5 rounded-full bg-primary-container shadow-[0_0_12px_2px_rgba(245,158,11,0.7)]"></span>
<span class="absolute w-4 h-4 rounded-full border border-primary-container/40 animate-ping"></span>
</div>
<!-- Inactive Subtle Dot 2 -->
<div class="w-2 h-2 rounded-full bg-surface-container-highest/60 border border-outline-variant/30"></div>
<!-- Inactive Subtle Dot 3 -->
<div class="w-2 h-2 rounded-full bg-surface-container-highest/60 border border-outline-variant/30"></div>
<!-- Inactive Subtle Dot 4 -->
<div class="w-2 h-2 rounded-full bg-surface-container-highest/60 border border-outline-variant/30"></div>
</div>
</div>
</div>
</main>
<!-- Lower Atmosphere & Progress Shelf -->
<footer class="relative z-30 w-full flex flex-col items-center pb-5">
<!-- Exit Hint Pill Indicator -->
<div class="mb-4 flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container-lowest/40 backdrop-blur-md border border-outline-variant/10 text-on-surface-variant/40 hover:text-on-surface-variant/80 transition-colors duration-300">
<span class="font-label-sm text-label-sm tracking-wide">Press</span>
<kbd class="px-1.5 py-0.5 rounded bg-surface-container-high/60 border border-outline-variant/30 font-tabular-clock text-label-sm text-primary/80">ESC</kbd>
<span class="font-label-sm text-label-sm tracking-wide">or</span>
<kbd class="px-1.5 py-0.5 rounded bg-surface-container-high/60 border border-outline-variant/30 font-tabular-clock text-label-sm text-primary/80">Z</kbd>
<span class="font-label-sm text-label-sm tracking-wide">to exit Zen Mode</span>
</div>
<!-- Razor-Thin Bottom Ambient Edge Progress Line (65% elapsed) -->
<div class="w-full h-[2.5px] bg-surface-container-highest/20 overflow-hidden relative">
<div class="h-full bg-gradient-to-r from-primary-container via-primary to-primary-fixed shadow-[0_0_12px_rgba(245,158,11,0.7)] transition-all duration-1000 ease-linear" id="sessionProgress" style="width: 65%;">
<!-- Glowing Leading Head Dot -->
<span class="absolute right-0 top-1/2 -translate-y-1/2 w-1.5 h-1.5 rounded-full bg-primary-fixed shadow-[0_0_8px_#ffddb8]"></span>
</div>
</div>
</footer>
<!-- Subtle Keyboard Micro-Interaction Script -->
<script>
    // Keyboard listeners to gracefully handle escape/zen toggle
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key.toLowerCase() === 'z') {
        const exitBtn = document.getElementById('exitZenBtn');
        if (exitBtn) {
          exitBtn.classList.add('scale-95', 'opacity-100');
          setTimeout(() => {
            exitBtn.classList.remove('scale-95');
            // Visual feedback pulse for the prompt demo
            document.body.style.transition = 'opacity 0.4s ease';
            document.body.style.opacity = '0.35';
            setTimeout(() => {
              document.body.style.opacity = '1';
            }, 500);
          }, 150);
        }
      }
    });

    // Optional active countdown micro-simulation
    let secondsTotal = 24 * 60 + 38;
    const readout = document.getElementById('timerReadout');
    const progressBar = document.getElementById('sessionProgress');
    const fullSessionSecs = 25 * 60; // 25 min pomodoro

    setInterval(() => {
      if (secondsTotal > 0) {
        secondsTotal--;
        const mins = Math.floor(secondsTotal / 60);
        const secs = secondsTotal % 60;
        if (readout) {
          readout.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        if (progressBar) {
          const percentElapsed = ((fullSessionSecs - secondsTotal) / fullSessionSecs) * 100;
          progressBar.style.width = `${Math.min(100, Math.max(0, percentElapsed))}%`;
        }
      }
    }, 1000);
  </script>
</body></html>
